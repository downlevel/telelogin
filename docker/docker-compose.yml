version: '3.8'

services:
  # FastAPI backend
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME:-YourBot}
      - DB_URL=${DB_URL:-sqlite:///data/db.sqlite3}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      - LOGIN_REQUEST_TTL_SECONDS=${LOGIN_REQUEST_TTL_SECONDS:-120}
      - REGISTRATION_TOKEN_TTL_SECONDS=${REGISTRATION_TOKEN_TTL_SECONDS:-1800}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-600}
      - RATE_LIMIT_USERNAME=${RATE_LIMIT_USERNAME:-5}
      - RATE_LIMIT_IP=${RATE_LIMIT_IP:-20}
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    networks:
      - telelogin_network

  # Telegram bot
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "src.bot"]
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME:-YourBot}
      - DB_URL=${DB_URL:-sqlite:///data/db.sqlite3}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - DEBUG=${DEBUG:-false}
      - LOGIN_REQUEST_TTL_SECONDS=${LOGIN_REQUEST_TTL_SECONDS:-120}
    volumes:
      - api_data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - telelogin_network

volumes:
  api_data:

networks:
  telelogin_network:
    driver: bridge
