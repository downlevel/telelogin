# http {} scope. PUBLIC_URL=https://auth.example.com; SSO_COOKIE_DOMAIN=example.com.
# Install your TLS certificate and key at the paths below.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    server_name auth.example.com;
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    server_name app.example.com;
    location = /_telelogin_verify {
        internal;
        proxy_pass http://127.0.0.1:8000/sso/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-TeleLogin-App $telelogin_app;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location @telelogin_login { return 302 $telelogin_login; }
    location / {
        include /etc/nginx/protect-app.conf;
        proxy_pass http://127.0.0.1:9000;
    }
}
