# Include at server scope on example.com; PUBLIC_URL=https://example.com/telelogin.
location ^~ /telelogin/internal/ { return 404; }
location ^~ /telelogin/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
}
location = /_telelogin_verify {
    internal;
    proxy_pass http://127.0.0.1:8000/sso/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-TeleLogin-App $telelogin_app;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location @telelogin_login { return 302 $telelogin_login; }
