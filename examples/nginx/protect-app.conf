# Include inside the app location. Register this id with src.admin app add.
set $telelogin_app myapp;
auth_request /_telelogin_verify;
auth_request_set $telelogin_user $upstream_http_x_telelogin_user;
auth_request_set $telelogin_user_id $upstream_http_x_telelogin_user_id;
auth_request_set $telelogin_login $upstream_http_x_telelogin_login;
error_page 401 = @telelogin_login;
proxy_set_header X-TeleLogin-User $telelogin_user;
proxy_set_header X-TeleLogin-User-Id $telelogin_user_id;
# nginx drops underscore headers unless underscores_in_headers is on; strip them anyway.
proxy_set_header X_TeleLogin_User "";
proxy_set_header X_TeleLogin_User_Id "";
