name: Release image

on:
  push:
    # Final releases (v2.0.0) and prereleases (v2.1.0-rc.1); prereleases never move latest.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/telelogin" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Telegram authentication with forward auth and OpenID Connect
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Require a semver tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::${GITHUB_REF_NAME} is not a semver tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
